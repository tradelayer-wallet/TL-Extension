[package]
name = "tl-wallet-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Pure TradeLayer wallet operations: explicit networks, addresses, coin selection, PSBT building, BIP-137 messages and a signing capability"
license = "ISC"
publish = false

[dependencies]
bitcoin = { version = "0.32", default-features = false, features = ["std", "secp-recovery"] }
bip39 = { version = "2.2", default-features = false, features = ["std"] }
# Vault (legacy import, new sealed format). All RustCrypto; nothing is hand-rolled.
aes = "0.8"
cbc = "0.1"
md-5 = "0.10"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
scrypt = { version = "0.11", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
subtle = { version = "2.6", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

# Optimise only the password-hashing and cipher crates in dev/test builds so scrypt-based tests
# stay fast; release behaviour is unchanged.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.cbc]
opt-level = 3
