name: Rust wallet core
on:
  pull_request:
    paths: ['rust/tl-wallet-core/**', '.github/workflows/rust-tl-wallet-core.yml']
  push:
    branches: [main]
    paths: ['rust/tl-wallet-core/**', '.github/workflows/rust-tl-wallet-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch pinned crates
        working-directory: rust/tl-wallet-core
        run: cargo fetch --locked
      - name: Unit, regression and legacy-parity tests
        working-directory: rust/tl-wallet-core
        run: cargo test --locked
      - name: Legacy parity vectors are reproducible from the pinned legacy files
        working-directory: rust/tl-wallet-core
        run: node scripts/compare-legacy.cjs --check
      - name: Clippy
        working-directory: rust/tl-wallet-core
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Format
        working-directory: rust/tl-wallet-core
        run: cargo fmt --all -- --check
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install elan (no default toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build proofs
        working-directory: rust/tl-wallet-core/lean
        run: lake build
      - name: No sorry or admit
        working-directory: rust/tl-wallet-core/lean
        run: |
          if grep -rnwE 'sorry|admit' --include=*.lean .; then
            echo "sorry/admit found"; exit 1
          fi
      - name: Axiom check
        working-directory: rust/tl-wallet-core/lean
        run: |
          out=$(lake env lean AxiomCheck.lean)
          echo "$out"
          if echo "$out" | grep -q sorryAx; then
            echo "sorryAx found"; exit 1
          fi
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned toolchain with wasm32 target
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          rustup target add wasm32-unknown-unknown --toolchain 1.90.0
          sudo apt-get install -y clang
      - name: Library builds for wasm32
        working-directory: rust/tl-wallet-core
        run: cargo +1.90.0 build --locked --lib --target wasm32-unknown-unknown
      - name: WASM smoke (Node host)
        working-directory: rust/tl-wallet-core/wasm-smoke
        run: |
          cargo +1.90.0 build --locked --release --target wasm32-unknown-unknown
          node scripts/wasm-smoke.mjs target/wasm32-unknown-unknown/release/tl_wallet_core_wasm_smoke.wasm
